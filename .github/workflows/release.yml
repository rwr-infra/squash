name: build-and-package

# - Any branch push triggers a build, to keep `main` green and catch breakage
#   early. No release is published for branch pushes.
# - A tag push (v*) triggers the full pipeline: build on every OS + release.
#   A tag fires the same `push` event whether created locally
#   (`git push origin v1.0.0`) or on the GitHub platform (web UI / API) — in
#   both cases `github.ref` is `refs/tags/*`, which the release job gates on.
# - Every OS smoke-tests its FINAL archive (extracted, no system Node, through
#   the launcher) before uploading it; the release job needs all of them, so a
#   platform whose bundle fails never reaches a Release.
on:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Same pinned version the bundle ships in runtime/ (scripts/node-runtime.mjs
      # reads .node-version too). Don't add `node-version:` — it would take
      # precedence over the file.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      # Tag is the source of truth for the version. Strip the leading `v` and
      # stamp it into package.json so every artifact (zip/tar.gz name, bundled
      # package.json) carries the tag's version — without this, `package.json`
      # would lag behind and artifacts would be named after the stale version
      # (e.g. v0.1.1 tag still producing squash-0.1.0-* files). Only runs on tag
      # pushes; plain branch pushes leave package.json untouched.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        # Explicit bash: this step uses bash parameter expansion (${TAG#v}),
        # but Windows runners default to PowerShell, which can't parse it. bash
        # (Git Bash) is present on every GitHub-hosted runner, so this works
        # uniformly across the ubuntu/macos/windows matrix.
        shell: bash
        run: |
          version="${TAG#v}"
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" "$version"
          echo "Stamped version $version"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Vitest (test/): the listen-address gate; every protected /api route
      # refuses requests without a valid token, however the path is spelled
      # (escapes, absolute-form request lines, WebSocket upgrades), and a new
      # /api route must be registered as protected or explicitly public; the
      # template store and /api/templates; the rwr_server.log line index
      # against generated files (CRLF, UTF-8 across reads, long lines,
      # truncation and replacement) and its routes — the one place the index
      # runs on Windows and Linux before a real rwr_server does; the real
      # supervisor + node-pty against a fake child: a user stop ends in
      # `stopped` with no auto-restart, a crash is still `crashed` and
      # restarted, stops, restarts and force-kills. A few minutes at most,
      # before Package so a regression fails before a 20-minute build — and,
      # on a tag, blocks the release. Measures coverage of src/ as it goes.
      - name: Test
        id: test
        run: npm run test:coverage
        timeout-minutes: 10

      # build (server + frontend) + assemble the portable bundle for THIS OS.
      # node-pty is native, so each runner produces its own platform binary —
      # that is the whole reason this matrix exists.
      - name: Package
        run: npm run package
        timeout-minutes: 20

      # Vitest (test/e2e/restart-policy.test.ts, test/e2e/e2e.config.ts). Requires
      # the compiled server and frontend produced by Package. Exercises real
      # HTTP/WS + PTY restart policies in isolated fixtures, including the full
      # 60-second stable-run reset. Failure blocks artifact upload/release.
      - name: Smoke-test restart policies end to end
        run: npm run smoke:restart-policy
        timeout-minutes: 10

      # Vitest (test/e2e/release.test.ts). Extracts release/<archive> for this
      # OS into a temp dir, strips node from PATH and drives it through
      # start.sh / start.bat: health, frontend, login, PTY round-trip,
      # loopback-only default, weak-password refusal, clean exit.
      - name: Smoke-test the release archive
        run: npm run smoke:release
        timeout-minutes: 10

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: squash-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

      # The Test step's coverage of src/, flagged with the OS; Codecov merges
      # the three (codecov.yml); also when a later step failed, so that each
      # commit gets all three. Last, once the archive is built and uploaded:
      # the action runs a downloaded CLI and puts the token in GITHUB_ENV, so
      # no later step sees either. Branch pushes only — a tag's commit was
      # uploaded when its branch was pushed. fail_ci_if_error stops the
      # action's wrapper from running a CLI that failed its signature or
      # checksum check; continue-on-error keeps a Codecov problem (no token,
      # an outage) from failing the job. CODECOV_TOKEN is an organization
      # secret. Pinned by commit: a third-party action handed a secret.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.test.outcome == 'success' && github.ref_type == 'branch' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        timeout-minutes: 5
        with:
          files: ./coverage/lcov.info
          disable_search: true
          flags: ${{ runner.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  release:
    needs: package
    # Only publish on tag pushes; plain branch pushes run package for CI only.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: squash-*
          path: artifacts

      # Flatten the per-OS artifact folders and publish one SHA256SUMS.txt so
      # users can verify a download (`sha256sum -c --ignore-missing`). Exactly
      # one archive per platform artifact: anything else is a missing platform
      # or an extra file that no smoke test covered.
      - name: Collect archives and checksums
        shell: bash
        run: |
          shopt -s nullglob
          dirs=(artifacts/*/)
          archives=(artifacts/*/*.zip artifacts/*/*.tar.gz)
          echo "platform artifacts: ${#dirs[@]}, archives: ${#archives[@]}"
          if [ "${#dirs[@]}" -eq 0 ] || [ "${#archives[@]}" -ne "${#dirs[@]}" ]; then
            echo "::error::expected exactly one archive per platform artifact"
            exit 1
          fi
          dupes=$(printf '%s\n' "${archives[@]##*/}" | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::duplicate archive names: $dupes"
            exit 1
          fi
          mkdir -p dist-release
          cp -- "${archives[@]}" dist-release/
          cd dist-release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Make the job idempotent: a re-run (retry / manual dispatch /
          # rebuilt tag) must not fail just because the release already exists.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets only."
          else
            # Draft first, publish after the upload: a new release never goes
            # public without its archives and SHA256SUMS.txt.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --draft
          fi
          # --clobber overwrites any same-named assets from a previous run.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist-release/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
